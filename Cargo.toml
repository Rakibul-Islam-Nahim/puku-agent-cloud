[workspace]
resolver = "2"
members = [
    "crates/puku-cloud-proto",
    "crates/puku-controld",
    "crates/puku-workerd",
    "crates/puku-cloud-cli",
    "crates/puku-observability",
    "crates/puku-guestd",
    "crates/puku-volume",
    "crates/puku-leases",
    "crates/puku-fence",
    "crates/puku-snapshot",
    "crates/puku-proxy",
    "crates/puku-rebuild",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Poridhi <sagoresarker.cse@gmail.com>"]

[workspace.dependencies]
puku-cloud-proto = { path = "crates/puku-cloud-proto" }
puku-observability = { path = "crates/puku-observability" }
puku-volume = { path = "crates/puku-volume" }
puku-leases = { path = "crates/puku-leases" }
puku-fence = { path = "crates/puku-fence" }
puku-snapshot = { path = "crates/puku-snapshot" }
puku-proxy = { path = "crates/puku-proxy" }
puku-rebuild = { path = "crates/puku-rebuild" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `transport` is default-on and is literally ["reqwest", "native-tls"], which
# would drag libssl into a debian:bookworm-slim image that has none. Every
# feature here is re-added by hand on top of default-features = false.
#
# Deliberately absent:
#   logs           default-on in 0.49; ships every INFO line AND its field
#                  values to Sentry Logs, straight through the PII floor
#   metrics        default-on, unused
#   release-health default-on, unused
sentry = { version = "0.49.1", default-features = false, features = [
    "backtrace", "contexts", "debug-images", "panic",
    "reqwest", "rustls",
    "tracing", "anyhow",
] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"

[profile.release]
lto = "thin"
