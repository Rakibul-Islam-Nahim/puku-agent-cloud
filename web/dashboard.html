<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>puku cloud</title>
<style>
  /* puku cloud — operator console.
     Light, paper-warm surface with one accent, in the same family as the
     rest of the puku product. Monospace is reserved for machine values
     (ids, sandbox names, money, states) so the eye can find them; prose
     and labels are sans. */
  :root {
    --paper:   #faf9f5;   /* app background */
    --card:    #ffffff;   /* raised surfaces */
    --sunken:  #f2f1ec;   /* wells, code blocks */
    --line:    #e6e4dd;   /* hairlines */
    --line-2:  #d6d3ca;   /* stronger dividers */
    --ink:     #23221f;   /* primary text */
    --ink-2:   #55534d;   /* secondary text */
    --muted:   #82807a;   /* tertiary */
    --faint:   #a8a59d;   /* quaternary, placeholders */
    --accent:  #c15f3c;   /* terracotta: the one accent */
    --accent-soft: #fdf1ec;
    --accent-line: #eccdbf;
    --green:   #2f7d5d;
    --green-soft: #eaf4ef;
    --amber:   #a8722a;
    --amber-soft: #fdf3e3;
    --red:     #b4453a;
    --red-soft: #fdeeec;
    --blue:    #3a6ea5;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(35,34,31,.05), 0 1px 3px rgba(35,34,31,.04);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    background: var(--card);
    color: var(--ink-2);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms, color 120ms;
  }
  button:hover { background: var(--sunken); color: var(--ink); border-color: var(--muted); }
  button:active { transform: translateY(0.5px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #a94f30; border-color: #a94f30; color: #fff; }
  button.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input, textarea {
    font-family: var(--sans);
    font-size: 13.5px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    padding: 8px 10px;
    width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  code { font-family: var(--mono); }

  .shell { display: flex; flex-direction: column; height: 100vh; }
  .app { display: flex; flex: 1; min-height: 0; }

  /* ---------------- status bar ----------------
     The question an operator opens this page to answer is "what is the
     fleet doing right now", so it is the first thing on the page. Each
     tile doubles as the filter for that state. */
  .statbar {
    display: flex;
    align-items: stretch;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .statbar .brandbox {
    padding: 12px 20px;
    display: flex; flex-direction: column; justify-content: center;
    min-width: 210px;
    border-right: 1px solid var(--line);
  }
  .statbar .brandbox b { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .statbar .brandbox small { color: var(--muted); font-size: 11.5px; }

  .tile {
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 12px 20px 10px;
    min-width: 104px;
    text-align: left;
    cursor: pointer;
  }
  .tile:hover { background: var(--sunken); }
  .tile[aria-pressed="true"] { background: var(--accent-soft); border-bottom-color: var(--accent); }
  .tile .n {
    font-family: var(--mono); font-size: 22px; font-weight: 500; line-height: 1.15;
    color: var(--ink); display: block; letter-spacing: -0.02em;
  }
  .tile .k {
    font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--muted);
  }
  /* Colour carries meaning only when the count is non-zero: a healthy
     fleet should not have a red number on screen. */
  .tile.hot  .n { color: var(--green); }
  .tile.attn .n { color: var(--amber); }
  .tile.bad  .n { color: var(--red); }
  .tile.zero .n { color: var(--faint); font-weight: 400; }
  .statbar .spacer { flex: 1; }
  .statbar .actions {
    display: flex; align-items: center; gap: 10px; padding: 0 20px;
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
  }

  /* ---------------- rail ---------------- */
  .rail {
    width: 340px; min-width: 340px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    background: var(--paper);
  }
  .newtask { padding: 14px; border-bottom: 1px solid var(--line); }
  .newtask textarea { resize: none; height: 62px; margin-bottom: 8px; }
  .newtask .row { display: flex; gap: 8px; }
  .newtask input { flex: 1; }

  .sessions { flex: 1; overflow-y: auto; padding: 8px; }
  .sess {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 11px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .sess:hover { background: var(--sunken); }
  .sess.active { background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 9px 10px; }
  .sess .prompt {
    font-size: 13.5px; color: var(--ink); font-weight: 450;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sess .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 2px; }

  /* Session-state dot. */
  .led { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--faint); }
  .led.running { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .led.waiting_input { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); animation: pulse 1.6s ease-in-out infinite; }
  .led.booting, .led.bootstrapping, .led.scheduled, .led.created, .led.stopping { background: var(--blue); }
  .led.completed { background: #9bb5a5; }
  .led.failed, .led.canceled { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .led.stopped { background: var(--card); border: 1.5px solid var(--faint); }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) { .led.waiting_input { animation: none; } }

  /* ---------------- memory ----------------
     Deliberately shows the rendered preamble rather than a memory count.
     "47 memories" tells an operator nothing about whether memory is helping;
     the text the agent is actually being told tells them immediately. */
  .memory { border-top: 1px solid var(--line); max-height: 40%; overflow-y: auto; flex: none; background: var(--card); }
  .memory .preamble { white-space: pre-wrap; font: 11px/1.5 var(--mono); padding: 8px 12px; color: var(--fg); }
  .memory .empty { padding: 8px 12px; color: var(--dim); font-size: 12px; }
  .memory .row { display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
  .memory input { flex: 1; }

  /* ---------------- fleet ---------------- */
  .fleet { border-top: 1px solid var(--line); max-height: 44%; overflow-y: auto; flex: none; background: var(--card); }
  .panelhead {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--muted);
    padding: 11px 16px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
    position: sticky; top: 0; background: var(--card);
  }
  .panelhead span:last-child { font-family: var(--mono); font-weight: 400; color: var(--faint); }
  /* These rows live in a 340px rail, so they clip rather than wrap — a
     wrapped monospace row turns the panel into a wall of text. */
  .wrow {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 16px; font-size: 12.5px; color: var(--ink-2);
  }
  .wrow > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .nm { color: var(--ink); font-weight: 550; }
  .wrow .dot { color: var(--green); }
  .wrow .dot.off { color: var(--faint); }
  .wrow button { font-size: 11px; padding: 2px 8px; flex: none; }
  .sbrow {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 4px 16px 4px 30px; font-family: var(--mono); font-size: 11.5px;
    color: var(--muted); cursor: pointer; white-space: nowrap; border-radius: 5px;
  }
  .sbrow:hover { background: var(--sunken); }
  .sbrow > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sbrow .sb { color: var(--ink-2); }
  .issue {
    padding: 7px 16px 7px 30px; display: grid; gap: 2px;
    border-left: 2px solid var(--amber); background: var(--amber-soft);
    margin: 3px 8px 3px 16px; border-radius: 0 6px 6px 0;
  }
  .issue .what { font-family: var(--mono); font-size: 11.5px; color: var(--amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .issue .why { font-size: 11.5px; color: var(--ink-2); }

  /* ---------------- main ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--paper); }

  .needsyou {
    border-bottom: 1px solid var(--accent-line);
    background: var(--accent-soft);
    padding: 12px 22px;
  }
  .needsyou h2 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--accent); margin: 0 0 6px;
  }
  .needsyou .q { display: flex; gap: 8px; align-items: center; padding: 4px 0; flex-wrap: wrap; }
  .needsyou .q .txt { font-size: 13.5px; color: var(--ink); flex: 1 1 240px; min-width: 0; cursor: pointer; font-weight: 450; }
  .needsyou .q input { width: 220px; flex: none; }
  .needsyou .q .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .needsyou .q .opt { background: var(--card); border-color: var(--accent-line); color: var(--accent); font-weight: 550; }
  .needsyou .q .opt:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .needsyou .q .deny { color: var(--muted); }
  .needsyou .q .deny:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }

  .sesshead {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .sesshead .title { font-size: 14.5px; font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statechip {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--sunken);
    color: var(--muted); flex: none;
  }
  .statechip.running { color: var(--green); border-color: transparent; background: var(--green-soft); }
  .statechip.waiting_input { color: var(--amber); border-color: transparent; background: var(--amber-soft); }
  .statechip.failed, .statechip.canceled { color: var(--red); border-color: transparent; background: var(--red-soft); }
  .cost { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: none; }

  .transcript { flex: 1; overflow-y: auto; padding: 20px 24px 28px; font-size: 13.5px; line-height: 1.65; }
  .transcript .ev { margin-bottom: 3px; white-space: pre-wrap; word-break: break-word; }
  .ev.text { color: var(--ink); margin: 10px 0; }
  .ev.tool { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
  .ev.tool b { color: var(--ink-2); font-weight: 600; }
  .ev.state { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
  .ev.user { color: var(--accent); margin: 10px 0; font-weight: 450; }
  .ev.result {
    color: var(--ink); border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    padding: 10px 14px; margin: 12px 0;
    background: var(--card); border-radius: 0 var(--radius) var(--radius) 0;
    box-shadow: var(--shadow);
  }
  .ev.err { color: var(--red); }
  .ev.question {
    color: var(--ink); border: 1px solid var(--accent-line);
    padding: 10px 14px; margin: 12px 0;
    background: var(--accent-soft); border-radius: var(--radius);
  }
  .empty { color: var(--faint); font-size: 13.5px; padding: 60px 24px; text-align: center; }

  /* Landing overview: the status-bar numbers with room to say what they
     mean, so an idle screen is still informative. */
  .overview { max-width: 640px; margin: 40px auto; }
  .overview h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 10px; }
  .ovcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .ovrow {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: 13.5px;
  }
  .ovrow:last-child { border-bottom: none; }
  .ovrow .lbl { color: var(--ink-2); }
  .ovrow .val { font-family: var(--mono); color: var(--ink); font-weight: 500; }
  .ovrow.warn .val { color: var(--amber); }
  .ovrow.bad .val { color: var(--red); }
  .ovrow.dim .val { color: var(--faint); }

  .composer {
    display: flex; gap: 8px; padding: 14px 22px;
    border-top: 1px solid var(--line); background: var(--card);
  }
  .composer input { flex: 1; }

  /* auth gate */
  .gate {
    position: fixed; inset: 0; background: var(--paper);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .gate .box {
    width: 400px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px; box-shadow: 0 4px 24px rgba(35,34,31,.07);
  }
  .gate h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; }
  .gate p { color: var(--ink-2); font-size: 13.5px; margin: 0 0 14px; }
  .gate input { margin-bottom: 12px; }
  .hidden { display: none !important; }
  .dim { opacity: .6; }

  @media (max-width: 860px) { .rail { display: none; } .statbar .brandbox { min-width: 0; } }
</style>
</head>
<body>

<div class="gate hidden" id="gate">
  <div class="box">
    <h1>puku cloud</h1>
    <p>This control plane requires an API key. Paste yours to continue — it stays in this browser.</p>
    <input id="gate-key" placeholder="pkc_…" autocomplete="off">
    <button id="gate-go" class="primary">Connect</button>
    <p id="gate-err" class="hidden" style="color: var(--danger)"></p>
  </div>
</div>

<div class="shell">
<header class="statbar" id="statbar">
  <div class="brandbox">
    <b>puku cloud</b>
    <small>agent sessions · microVM isolated</small>
  </div>
  <button class="tile" id="t-running"   data-filter="running"><span class="n">–</span><span class="k">running</span></button>
  <button class="tile" id="t-waiting"   data-filter="waiting_input"><span class="n">–</span><span class="k">needs you</span></button>
  <button class="tile" id="t-starting"  data-filter="starting"><span class="n">–</span><span class="k">starting</span></button>
  <button class="tile" id="t-stopped"   data-filter="stopped"><span class="n">–</span><span class="k">stopped</span></button>
  <button class="tile" id="t-completed" data-filter="completed"><span class="n">–</span><span class="k">completed</span></button>
  <button class="tile" id="t-failed"    data-filter="failed"><span class="n">–</span><span class="k">failed</span></button>
  <button class="tile" id="t-issues"    data-filter="issues"><span class="n">–</span><span class="k">issues</span></button>
  <div class="spacer"></div>
  <div class="actions"><span class="dim" id="clock"></span></div>
</header>

<div class="app">
  <nav class="rail">
    <div class="newtask">
      <textarea id="new-prompt" placeholder="Describe a task for the agent…"></textarea>
      <div class="row">
        <input id="new-repo" placeholder="https://github.com/… (optional)">
        <button id="new-go" class="primary">Run</button>
      </div>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="fleet hidden" id="fleet"></div>
    <div class="memory hidden" id="memory"></div>
  </nav>

  <main class="main">
    <div class="needsyou hidden" id="needsyou"></div>
    <div class="sesshead hidden" id="sesshead">
      <span class="statechip" id="chip">—</span>
      <span class="title" id="title"></span>
      <span class="cost" id="cost"></span>
      <button id="btn-interrupt">interrupt</button>
      <button id="btn-park">park</button>
      <button id="btn-resume" class="hidden">resume</button>
      <button id="btn-cancel" class="danger">cancel</button>
    </div>
    <div class="transcript" id="transcript">
      <div class="empty" id="landing">Select a session — or describe a task on the left and Run.</div>
    </div>
    <div class="composer hidden" id="composer">
      <input id="say" placeholder="Message the agent…">
      <button id="say-go" class="primary">Send</button>
    </div>
  </main>
</div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = {
  key: localStorage.getItem("puku_api_key") || "",
  sessions: [],
  selected: null,   // session id
  ws: null,
  maxSeq: 0,
  isAdmin: false,
  fleet: null,     // last /v1/fleet response
  memory: null,    // last /v1/memory response
  memoryRepo: "",  // which repo's profile is on screen
  filter: null,    // active status tile, or null for everything
};

// ---------------------------------------------------------------- api

function headers() {
  const h = { "Content-Type": "application/json" };
  if (state.key) h["Authorization"] = "Bearer " + state.key;
  return h;
}
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: headers(),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showGate("This key was rejected."); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error.message; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ---------------------------------------------------------------- gate

function showGate(err) {
  $("gate").classList.remove("hidden");
  if (err) { $("gate-err").textContent = err; $("gate-err").classList.remove("hidden"); }
}
$("gate-go").onclick = async () => {
  state.key = $("gate-key").value.trim();
  localStorage.setItem("puku_api_key", state.key);
  $("gate").classList.add("hidden");
  boot();
};
$("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("gate-go").click(); });

// ---------------------------------------------------------------- summary

// The states worth counting separately. Everything between dispatch and a
// running agent is one "starting" bucket: an operator cares that a session
// has not begun work yet, not which of four boot steps it is on.
const STARTING = ["created", "scheduled", "booting", "bootstrapping"];
const TERMINAL_BAD = ["failed", "canceled"];

function bucketOf(s) {
  if (STARTING.includes(s.state)) return "starting";
  if (TERMINAL_BAD.includes(s.state)) return "failed";
  if (s.state === "stopping") return "running";
  return s.state; // running | waiting_input | stopped | completed | reaped
}

function issueCount() {
  const d = state.fleet && state.fleet.drift;
  return d ? (d.vanished.length + d.orphaned.length) : 0;
}

function renderLanding() {
  if (state.selected) return;
  const el = $("transcript");
  const counts = { running: 0, waiting_input: 0, starting: 0, stopped: 0, completed: 0, failed: 0 };
  for (const s of state.sessions) { const b = bucketOf(s); if (b in counts) counts[b]++; }
  const spend = state.sessions.reduce((n, s) => n + (+s.cost_usd || 0), 0);
  const f = state.fleet;
  const workers = f ? f.workers.length : null;
  const connected = f ? f.workers.filter((w) => w.connected).length : null;
  const sandboxes = f ? f.workers.reduce((n, w) => n + w.sessions.length, 0) : null;

  const rows = [
    ["Agents working now", counts.running, counts.running ? "" : "dim"],
    ["Blocked on a question", counts.waiting_input, counts.waiting_input ? "warn" : ""],
    ["Starting up", counts.starting, ""],
    ["Parked (resumable)", counts.stopped, ""],
    ["Completed", counts.completed, ""],
    ["Failed or canceled", counts.failed, counts.failed ? "bad" : ""],
  ];
  if (f) {
    rows.push(["Workers online", `${connected}/${workers}`, connected ? "" : "bad"]);
    rows.push(["Sandboxes running", sandboxes, ""]);
    rows.push(["Issues needing attention", issueCount(), issueCount() ? "warn" : ""]);
  }
  rows.push(["Spend across these sessions", "$" + spend.toFixed(2), ""]);

  el.innerHTML = `<div class="overview"><h3>Overview</h3><div class="ovcard">` +
    rows.map(([lbl, val, cls]) =>
      `<div class="ovrow ${cls}"><span class="lbl">${lbl}</span><span class="val">${val}</span></div>`
    ).join("") +
    `</div><p style="color:var(--faint);font-size:12.5px;margin-top:16px;text-align:center">` +
    `Pick a session on the left to watch its transcript, or describe a task and Run.</p></div>`;
}

function renderSummary() {
  const counts = { running: 0, waiting_input: 0, starting: 0, stopped: 0, completed: 0, failed: 0 };
  for (const s of state.sessions) {
    const b = bucketOf(s);
    if (b in counts) counts[b]++;
  }
  counts.issues = issueCount();

  const tone = {
    running: "hot", waiting_input: "attn", starting: "",
    stopped: "", completed: "", failed: "bad", issues: "attn",
  };
  for (const [k, n] of Object.entries(counts)) {
    const el = $("t-" + (k === "waiting_input" ? "waiting" : k));
    if (!el) continue;
    el.querySelector(".n").textContent = n;
    el.className = "tile " + (n === 0 ? "zero" : tone[k]);
    el.setAttribute("aria-pressed", String(state.filter === k));
  }
  $("clock").textContent = new Date().toLocaleTimeString();
  renderLanding();
}

// Clicking a tile scopes the session list; clicking it again clears.
for (const tile of document.querySelectorAll(".tile")) {
  tile.onclick = () => {
    const f = tile.dataset.filter;
    state.filter = state.filter === f ? null : f;
    if (state.filter === "issues") renderFleet();
    renderSessions();
    renderSummary();
  };
}

// ---------------------------------------------------------------- sessions list

function stateName(s) { return s.replaceAll("_", " "); }

async function refreshSessions() {
  try {
    state.sessions = await api("GET", "/v1/sessions?limit=100");
  } catch { return; }
  renderSessions();
  renderSummary();
  renderNeedsYou();
  if (state.selected) {
    const cur = state.sessions.find((x) => x.id === state.selected);
    if (cur) renderHead(cur);
  }
}

function renderSessions() {
  const el = $("sessions");
  el.innerHTML = "";
  const shown = state.sessions.filter(
    (s) => !state.filter || state.filter === "issues" || bucketOf(s) === state.filter,
  );
  if (!shown.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.style.padding = "28px 16px";
    d.textContent = state.filter ? `No ${stateName(state.filter)} sessions.` : "No sessions yet.";
    el.appendChild(d);
    return;
  }
  for (const s of shown) {
    const d = document.createElement("div");
    d.className = "sess" + (s.id === state.selected ? " active" : "");
    d.innerHTML = `<div class="led ${s.state}"></div>
      <div style="min-width:0">
        <div class="prompt"></div>
        <div class="meta">${stateName(s.state)} · $${(+s.cost_usd).toFixed(4)} · ${s.id.slice(0, 8)}</div>
      </div>`;
    d.querySelector(".prompt").textContent = s.title || s.prompt;
    d.onclick = () => select(s.id);
    el.appendChild(d);
  }
}

function renderNeedsYou() {
  const waiting = state.sessions.filter((s) => s.state === "waiting_input");
  const box = $("needsyou");
  if (!waiting.length) { box.classList.add("hidden"); box.dataset.sig = ""; return; }
  // Never rebuild under the user's cursor: a focused answer box (or one
  // with a draft) survives the poll, and an unchanged waiting set skips
  // the re-render entirely.
  if (box.contains(document.activeElement)) return;
  if ([...box.querySelectorAll("input")].some((i) => i.value)) return;
  const sig = waiting.map((s) => s.id).join(",");
  if (box.dataset.sig === sig && !box.classList.contains("hidden")) return;
  box.dataset.sig = sig;
  box.classList.remove("hidden");
  box.innerHTML = "<h2>Needs you</h2>";
  for (const s of waiting) {
    const q = s.pending_question || {};
    const row = document.createElement("div");
    row.className = "q";
    row.innerHTML = `<span class="txt"></span><span class="opts"></span>` +
      `<input placeholder="Answer…"><button>Send</button><button class="deny">Deny</button>`;
    row.querySelector(".txt").textContent = questionText(q) + " — " + s.title.slice(0, 50);
    row.querySelector(".txt").onclick = () => select(s.id);

    const input = row.querySelector("input");
    const send = async (text, deny) => {
      try {
        await answerQuestion(s.id, q, text, deny);
        input.value = "";
        refreshSessions();
      } catch (e) { alert(e.message); }
    };
    // The agent offers labelled options; clicking one beats retyping it.
    for (const opt of questionOptions(q)) {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt.label;
      if (opt.description) b.title = opt.description;
      b.onclick = () => send(opt.label, false);
      row.querySelector(".opts").appendChild(b);
    }
    row.querySelector("button").onclick = () => {
      if (input.value.trim()) send(input.value.trim(), false);
    };
    row.querySelector(".deny").onclick = () => send(input.value.trim(), true);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim()) send(input.value.trim(), false);
    });
    box.appendChild(row);
  }
}


// The platform stores a pending question as its projection of puku-cli's
// `can_use_tool` control request: {kind, request_id, tool_name, tool_use_id,
// input:{questions:[{question, header, options:[{label, description}]}]}}.
// The answer must echo `request_id` — puku-cli is blocked on that control
// frame and an answer with any other id is refused.
function questionText(q) {
  const first = q && q.input && q.input.questions && q.input.questions[0];
  if (first && first.question) return first.question;
  if (q && q.tool_name) return q.tool_name + " needs approval";
  return "waiting for input";
}

function questionOptions(q) {
  const first = q && q.input && q.input.questions && q.input.questions[0];
  return (first && first.options) || [];
}

async function answerQuestion(sessionId, q, answer, deny) {
  const body = deny
    ? { question_id: q.request_id, decision: "deny", message: answer || "declined" }
    : { question_id: q.request_id, answer };
  await api("POST", `/v1/sessions/${sessionId}/answer`, body);
}

// ---------------------------------------------------------------- transcript

function line(cls, text) {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  d.textContent = text;
  return d;
}

function renderEvent(ev) {
  const t = $("transcript");
  const p = ev.payload || {};
  const ty = p.type || "";
  const out = [];
  if (ev.kind === "agent") {
    if (ty === "system" && p.subtype === "init") {
      out.push(line("state", `── agent ready · model ${p.model || "?"} ──`));
    } else if (ty === "system" && p.error) {
      out.push(line("err", `${p.subtype || "system"}: ${p.error} (status ${p.error_status ?? "?"}, attempt ${p.attempt ?? "?"})`));
    } else if (ty === "assistant") {
      const blocks = (p.message && p.message.content) || [];
      for (const b of blocks) {
        if (b.type === "text" && b.text) out.push(line("text", b.text));
        if (b.type === "tool_use") {
          const arg = b.input ? (b.input.command || b.input.file_path || b.input.pattern || b.input.question || "") : "";
          const d = line("tool", "");
          d.innerHTML = "⏺ <b></b> <span></span>";
          d.querySelector("b").textContent = b.name || "?";
          d.querySelector("span").textContent = String(arg).slice(0, 120);
          if (b.name === "AskUserQuestion" || b.name === "ExitPlanMode") d.className = "ev question";
          out.push(d);
        }
      }
    } else if (ty === "result") {
      const d = line("result", "");
      d.textContent = `${p.subtype || "result"} · $${(+p.total_cost_usd || 0).toFixed(4)}` + (p.result ? "\n" + p.result : "");
      out.push(d);
    } else if (ty === "truncated") {
      out.push(line("state", `… output truncated (${p.bytes} bytes, spilled to blob)`));
    }
  } else if (ev.kind === "session") {
    if (ty === "session.state") out.push(line("state", `[${stateName(p.state || "?")}]` + (p.error ? " " + p.error : "")));
    if (ty === "session.question") out.push(line("question", "agent is waiting for your answer"));
    if (ty === "session.usage") { /* folded into the result banner */ }
  } else if (ev.kind === "user") {
    out.push(line("user", "> " + (p.text || "")));
  } else if (ev.kind === "exec") {
    if (ty === "exec.exited") out.push(line("state", `[agent process exited ${p.code}]`));
  }
  const stick = t.scrollHeight - t.scrollTop - t.clientHeight < 60;
  for (const d of out) t.appendChild(d);
  if (stick) t.scrollTop = t.scrollHeight;
}

function renderHead(s) {
  $("sesshead").classList.remove("hidden");
  $("composer").classList.remove("hidden");
  $("title").textContent = s.prompt;
  $("cost").textContent = "$" + (+s.cost_usd).toFixed(4);
  const chip = $("chip");
  chip.textContent = stateName(s.state);
  chip.className = "statechip " + s.state;
  const active = ["running", "waiting_input"].includes(s.state);
  $("btn-interrupt").classList.toggle("hidden", !active);
  $("btn-park").classList.toggle("hidden", !active);
  $("btn-resume").classList.toggle("hidden", s.state !== "stopped");
  $("btn-cancel").classList.toggle("hidden", ["completed", "failed", "canceled", "reaped"].includes(s.state));
  $("say").placeholder = s.state === "waiting_input" ? "Answer the agent…" : "Message the agent…";
}

function select(id) {
  state.selected = id;
  state.maxSeq = 0;
  // Put it in the URL so a session can be linked to. `puku-cli --cloud`
  // prints this shape as its "View:" line; without it the only honest link
  // was the root, leaving the reader to find the session in the list.
  // replaceState, not a hash assignment: assigning would re-enter through
  // onhashchange and select() twice.
  if (sessionFromHash() !== id) history.replaceState(null, "", `#/s/${id}`);
  $("transcript").innerHTML = "";
  const s = state.sessions.find((x) => x.id === id);
  if (s) renderHead(s);
  refreshSessions();
  connectWs(id);
}

function connectWs(id) {
  if (state.ws) { state.ws.onclose = null; state.ws.close(); state.ws = null; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const auth = state.key ? `?api_key=${encodeURIComponent(state.key)}` : "";
  const ws = new WebSocket(`${proto}://${location.host}/v1/sessions/${id}/attach${auth}`);
  state.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", after_seq: 0 }));
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "events") {
      for (const ev of msg.events) {
        if (ev.seq <= state.maxSeq) continue;
        state.maxSeq = ev.seq;
        renderEvent(ev);
      }
    } else if (msg.type === "state") {
      const s = state.sessions.find((x) => x.id === id);
      if (s) { s.state = typeof msg.state === "string" ? msg.state : s.state; renderHead(s); }
      refreshSessions();
    } else if (msg.type === "error") {
      $("transcript").appendChild(line("err", "error: " + msg.message));
    }
  };
  ws.onclose = () => {
    if (state.selected === id) setTimeout(() => connectWs(id), 2500);
  };
}

// ---------------------------------------------------------------- actions

$("new-go").onclick = async () => {
  const prompt = $("new-prompt").value.trim();
  if (!prompt) return;
  const body = { prompt };
  const repo = $("new-repo").value.trim();
  if (repo) body.repo = repo;
  try {
    const s = await api("POST", "/v1/sessions", body);
    $("new-prompt").value = "";
    await refreshSessions();
    select(s.id);
  } catch (e) { alert(e.message); }
};

$("say-go").onclick = sendSay;
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter") sendSay(); });
async function sendSay() {
  const text = $("say").value.trim();
  if (!text || !state.selected) return;
  const s = state.sessions.find((x) => x.id === state.selected);
  try {
    if (s && s.state === "waiting_input" && s.pending_question) {
      await answerQuestion(s.id, s.pending_question, text, false);
    } else {
      await api("POST", `/v1/sessions/${state.selected}/input`, { text });
    }
    $("say").value = "";
  } catch (e) { alert(e.message); }
}

function verb(btn, path) {
  $(btn).onclick = async () => {
    if (!state.selected) return;
    try { await api("POST", `/v1/sessions/${state.selected}/${path}`); refreshSessions(); }
    catch (e) { alert(e.message); }
  };
}
verb("btn-interrupt", "interrupt");
verb("btn-park", "stop");
verb("btn-resume", "resume");
$("btn-cancel").onclick = async () => {
  if (!state.selected) return;
  if (!confirm("Cancel this session? The VM is destroyed; the transcript is kept.")) return;
  try { await api("DELETE", `/v1/sessions/${state.selected}`); refreshSessions(); }
  catch (e) { alert(e.message); }
};

// ---------------------------------------------------------------- workers

async function refreshWorkers() {
  // /v1/fleet is the operator view: each worker, the sessions it is
  // actually running, and where the platform's belief and the host's
  // reality disagree. Hidden entirely for non-admins.
  try { state.fleet = await api("GET", "/v1/fleet"); state.isAdmin = true; }
  catch { $("fleet").classList.add("hidden"); state.fleet = null; renderSummary(); return; }
  renderFleet();
  renderSummary();
}

// ---------------------------------------------------------------- memory

async function refreshMemory() {
  // Absent memory service, or memory off for this org: the panel stays
  // hidden rather than showing an inert toggle.
  try { state.memory = await api("GET", "/v1/memory"); }
  catch { state.memory = null; }
  renderMemory();
}

function renderMemory() {
  const el = $("memory");
  const m = state.memory;
  if (!m || !m.available) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML = "";

  const head = document.createElement("div");
  head.className = "panelhead";
  head.innerHTML = `<span>Memory</span><span>${m.enabled ? "on" : "off"}</span>`;
  el.appendChild(head);

  const row = document.createElement("div");
  row.className = "row";
  const toggle = document.createElement("button");
  toggle.textContent = m.enabled ? "turn off" : "turn on";
  toggle.onclick = async () => {
    toggle.disabled = true;
    try { state.memory = await api("POST", "/v1/memory", { enabled: !m.enabled }); }
    catch (e) { alert(e.message); }
    toggle.disabled = false;
    renderMemory();
  };
  const repo = document.createElement("input");
  repo.placeholder = "repo url (blank = org-wide)";
  repo.value = state.memoryRepo;
  const show = document.createElement("button");
  show.textContent = "show preamble";
  show.onclick = async () => {
    state.memoryRepo = repo.value.trim();
    show.disabled = true;
    try {
      const q = state.memoryRepo ? `?repo=${encodeURIComponent(state.memoryRepo)}` : "";
      const p = await api("GET", `/v1/memory/profile${q}`);
      renderPreamble(el, p);
    } catch (e) { alert(e.message); }
    show.disabled = false;
  };
  row.append(toggle, repo, show);
  el.appendChild(row);

  if (!m.enabled) {
    const note = document.createElement("div");
    note.className = "empty";
    // Enabling memory starts sending transcript text off this machine. Say
    // so on the control that does it, not only in a document.
    note.textContent = "Off. Turning it on sends distilled session transcripts to the memory service.";
    el.appendChild(note);
  }
}

function renderPreamble(el, p) {
  for (const old of el.querySelectorAll(".preamble, .empty.result")) old.remove();
  const box = document.createElement("div");
  if (p && p.preamble) {
    box.className = "preamble";
    box.textContent = p.preamble;
  } else {
    box.className = "empty result";
    box.textContent = "Nothing to inject yet — this repo has no memories a session would be told.";
  }
  el.appendChild(box);
}

function renderFleet() {
  const el = $("fleet");
  const fleet = state.fleet;
  if (!fleet) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML = "";

  const live = fleet.workers.reduce((n, w) => n + w.sessions.length, 0);
  const head = document.createElement("div");
  head.className = "panelhead";
  head.innerHTML = `<span>Fleet</span><span>${fleet.workers.length} worker(s) · ${live} sandbox(es)</span>`;
  el.appendChild(head);

  for (const w of fleet.workers) {
    const draining = w.status === "draining";
    const row = document.createElement("div");
    row.className = "wrow";
    // "unknown" and "none" are different answers: a worker that has never
    // reported an inventory must not read as an empty host.
    const inv = w.inventory === null ? "inventory unknown" : `${w.inventory.length} on host`;
    row.innerHTML = `<span><span class="dot${w.connected ? "" : " off"}">●</span> <span class="nm">${w.name}</span> ` +
      `${w.used_slots}/${w.capacity_slots}${draining ? " · draining" : ""} ` +
      `<span class="dim">· ${inv}</span></span>` +
      `<button>${draining ? "undrain" : "drain"}</button>`;
    row.querySelector("button").onclick = async () => {
      try {
        await api("POST", `/v1/workers/${w.id}/${draining ? "undrain" : "drain"}`);
        refreshWorkers();
      } catch (e) { alert(e.message); }
    };
    el.appendChild(row);

    for (const sess of w.sessions) {
      const age = sess.started_at ? (Date.now() - new Date(sess.started_at)) / 1000 : null;
      const sb = document.createElement("div");
      sb.className = "sbrow";
      sb.innerHTML = `<span>${sess.waiting ? "?" : "·"} <span class="sb">${sess.sandbox}</span></span>` +
        `<span>${sess.state}${age !== null ? " · " + fmtAge(age) : ""} · $${(sess.cost_usd || 0).toFixed(3)}</span>`;
      sb.onclick = () => select(sess.id);
      sb.title = sess.title || "";
      el.appendChild(sb);
    }
  }

  const { vanished, orphaned } = fleet.drift;
  if (vanished.length || orphaned.length) {
    const h = document.createElement("div");
    h.className = "panelhead";
    h.innerHTML = `<span style="color:var(--amber)">Issues</span>` +
      `<span>${vanished.length + orphaned.length}</span>`;
    el.appendChild(h);

    for (const v of vanished) {
      const d = document.createElement("div");
      d.className = "issue";
      // The platform believes this session is live; its VM is not there.
      d.innerHTML = `<span class="what">⚠ ${v.sandbox}</span>` +
        `<span class="why">${v.state} here, but gone on ${v.worker} — cancel it</span>`;
      d.style.cursor = "pointer";
      d.onclick = () => select(v.session_id);
      el.appendChild(d);
    }
    for (const o of orphaned) {
      const d = document.createElement("div");
      d.className = "issue";
      // A VM nobody is driving, holding a worker's memory.
      d.innerHTML = `<span class="what">⚠ ${o.sandbox}</span>` +
        `<span class="why">on ${o.worker} with no session — reaped when that worker reconnects</span>`;
      el.appendChild(d);
    }
  }
}

function fmtAge(seconds) {
  if (seconds < 60) return `${seconds}s`;
  if (seconds < 3600) return `${Math.round(seconds / 60)}m`;
  return `${(seconds / 3600).toFixed(1)}h`;
}

// ---------------------------------------------------------------- routing

const HASH_SESSION = /^#\/s\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i;

function sessionFromHash() {
  const m = HASH_SESSION.exec(location.hash);
  return m ? m[1] : null;
}

// Back/forward and pasted links both land here.
window.addEventListener("hashchange", () => {
  const id = sessionFromHash();
  if (id && id !== state.selected) select(id);
});

// ---------------------------------------------------------------- boot

async function boot() {
  try {
    await refreshSessions();
  } catch { return; }
  // Open the linked session once the list exists, so renderHead has a row to
  // read. An id that is not in the list still selects: the transcript loads
  // over the websocket regardless, and the header fills in on the next
  // refresh.
  const linked = sessionFromHash();
  if (linked) select(linked);
  refreshWorkers();
  setInterval(refreshSessions, 4000);
  setInterval(refreshWorkers, 15000);
  // Memory changes on the scale of consolidation runs, not seconds.
  refreshMemory();
  setInterval(refreshMemory, 60000);
}
boot();
</script>
</body>
